# DPDK Packet Processor Configuration

[dpdk]
# EAL (Environment Abstraction Layer) arguments
# These are passed to rte_eal_init()

# Number of memory channels (depends on your CPU)
memory_channels = 4

# Hugepage memory size (MB)
memory = 2048

# CPU cores to use (lcore mask)
# 0x3 = cores 0,1
# 0xF = cores 0,1,2,3
lcore_mask = 0x3

# PCI device whitelist (optional, leave empty for auto-detect)
# Example: pci_whitelist = 0000:00:08.0
pci_whitelist = 

# Log level (0-8, 8=DEBUG)
log_level = 6

[capture]
# Network interface port ID to capture from (usually 0)
port_id = 0

# Promiscuous mode (true/false)
promiscuous = true

# BPF filter (not yet implemented in DPDK version)
# For now, all packets are captured
bpf_filter = 

[features]
# Feature ring buffer size (must be power of 2)
ring_size = 8192

# Export format (ring/json/both)
# ring: Export to shared memory ring for Python
# json: Write to JSON file
# both: Both methods
export_mode = ring

# JSON output file (if export_mode=json or both)
json_output = /tmp/dpdk_features.json

[performance]
# RX burst size (number of packets to receive at once)
rx_burst_size = 32

# Enable statistics printing (interval in seconds, 0=disabled)
stats_interval = 10
